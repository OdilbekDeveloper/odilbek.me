# Railway deployment configuration for the web service (docs/DEPLOYMENT.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs to completion before the new container starts. A non-zero exit stops the deploy and the
# previous release keeps serving, so a failed migration never meets traffic, and only one process
# ever migrates.
preDeployCommand = ["python manage.py predeploy"]

# /healthz/ also checks the database, so a release that cannot reach it never receives traffic.
healthcheckPath = "/healthz/"
healthcheckTimeout = 60

# One replica. The app is stateless, but a personal site has no need for more, and memory is billed.
numReplicas = 1

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
